<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반려견 수첩</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반려견 수첩">
<meta name="theme-color" content="#f2f5f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* layout: one-screen mobile app — header with dog name, scrolling cards, bottom tabs, slide-up sheets */
:root{
  --bg:#f2f5f1; --surface:#ffffff; --ink:#1b2420; --muted:#69766f; --line:#e1e7e2;
  --accent:#2f7a55; --accent-soft:#e2f0e8; --warn:#b7791f; --warn-soft:#fbf1dd; --bad:#c43d3d; --bad-soft:#fbe7e7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --ink:#e7eee9; --muted:#93a39a; --line:#26322b;
  --accent:#6cc497; --accent-soft:#1a3326; --warn:#e3b05a; --warn-soft:#352a14; --bad:#ef7676; --bad-soft:#3a1d1d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --ink:#e7eee9; --muted:#93a39a; --line:#26322b;
  --accent:#6cc497; --accent-soft:#1a3326; --warn:#e3b05a; --warn-soft:#352a14; --bad:#ef7676; --bad-soft:#3a1d1d; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:20px;font-weight:700}
header .sub{font-size:12px;color:var(--muted)}
main{flex:1;overflow-y:auto;padding:4px 16px 110px;display:flex;flex-direction:column;gap:14px}
main > *{flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi .lab{font-size:12px;color:var(--muted)} .kpi .val{font-size:22px;font-weight:700} .kpi .val small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.walk-btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:700;background:var(--accent);color:var(--surface);display:flex;justify-content:center;align-items:center;gap:10px}
.walk-btn.on{background:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:500} .row .t2{font-size:12px;color:var(--muted)}
.dday{flex:none;font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent);min-width:54px;text-align:center}
.dday.none{background:var(--line);color:var(--muted)}
.dday.soon{background:var(--warn-soft);color:var(--warn)} .dday.over{background:var(--bad-soft);color:var(--bad)}
.mini{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;font-size:13px;font-weight:500}
.mini.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.mini.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.icon{flex:none;border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:8px 0;border-radius:8px;font-weight:500;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:var(--surface)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week .d{font-size:11px;color:var(--muted)} .week .b{height:64px;display:flex;align-items:flex-end;justify-content:center}
.week .b i{display:block;width:60%;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px}
.week .v{font-size:11px}
.week .today .d{color:var(--accent);font-weight:700}
svg text{fill:var(--muted);font-size:10px;font-family:var(--font)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;padding:6px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(16px, calc(50% - 264px));bottom:calc(env(safe-area-inset-bottom) + 74px);width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--surface);font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.45);display:none;z-index:10}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;z-index:11;display:flex;flex-direction:column;gap:12px}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h3{margin:0;font-size:17px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;background:var(--accent);color:var(--surface)}
.btn.ghost{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px}
.actions .btn.ghost{width:auto;padding:14px 18px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--muted)}
.tag.h{background:var(--bad-soft);color:var(--bad)} .tag.w{background:var(--accent-soft);color:var(--accent)} .tag.c{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <header><div><h1 id="title">반려견 수첩</h1><div class="sub" id="sub"></div></div><span class="sub" id="status"></span></header>
  <main id="main"></main>
</div>
<button class="fab" id="fab" aria-label="기록 추가">+</button>
<nav class="tabs"><div class="in">
  <button data-tab="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button data-tab="walk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="4" r="2"/><path d="M9 21l2-6 3 3v3M7 12l3-4 4 1 2 4 3 1"/></svg>산책</button>
  <button data-tab="care"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>케어</button>
  <button data-tab="log"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="4"/></svg>건강</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<form class="sheet" id="sheet" autocomplete="off"></form>
<div class="toast" id="toast"></div>

<script>
(function(){
const DEFAULT_CARE = [
  {id:"c1", name:"심장사상충 예방", every:30, last:"", kind:"약"},
  {id:"c2", name:"외부구충 (진드기·벼룩)", every:30, last:"", kind:"약"},
  {id:"c3", name:"내부구충", every:90, last:"", kind:"약"},
  {id:"c4", name:"종합백신 (DHPPL)", every:365, last:"", kind:"접종"},
  {id:"c5", name:"광견병 접종", every:365, last:"", kind:"접종"},
  {id:"c6", name:"건강검진", every:365, last:"", kind:"병원"},
  {id:"c7", name:"목욕", every:14, last:"", kind:"관리"},
  {id:"c8", name:"미용", every:45, last:"", kind:"관리"},
  {id:"c9", name:"발톱 깎기", every:21, last:"", kind:"관리"},
  {id:"s1", name:"사료", every:30, last:"", kind:"구매"},
  {id:"s2", name:"간식", every:21, last:"", kind:"구매"},
  {id:"s3", name:"배변패드", every:30, last:"", kind:"구매"}
];
const S = {db:null, prof:null, care:null, walks:[], logs:[], tab:"home", loaded:false, careFilter:"전체", logFilter:"전체", confirm:null};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtD = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => fmtD(new Date());
const addDays = (ds,n) => { const d=new Date(ds+"T00:00:00"); d.setDate(d.getDate()+n); return fmtD(d); };
const diffDays = (a,b) => Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000);
const DOW = ["일","월","화","수","목","금","토"];
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const prof = () => S.prof || {};
const care = () => (S.care && S.care.items) || DEFAULT_CARE;
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1800); }
async function dbSet(ref, data){ let last; for(let i=0;i<4;i++){ try{ return await ref.set(data); }catch(e){ last=e; if(e&&(e.code==="resource_exhausted"||e.code==="unavailable")){ await sleep(1500*(i+1)); continue; } throw e; } } throw last; }
async function dbDel(ref){ let last; for(let i=0;i<4;i++){ try{ return await ref.delete(); }catch(e){ last=e; if(e&&(e.code==="resource_exhausted"||e.code==="unavailable")){ await sleep(1500*(i+1)); continue; } throw e; } } throw last; }
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function errText(e){ const c=e&&e.code; return c==="resource_exhausted" ? "잠깐 사이에 저장이 많았어요. 잠시 뒤 다시 눌러주세요." : "저장하지 못했어요."+(c?" ("+c+")":""); }

/* ---------- 계산 ---------- */
function ageText(birth){
  if(!birth) return "";
  const b=new Date(birth+"T00:00:00"), n=new Date();
  let m=(n.getFullYear()-b.getFullYear())*12+(n.getMonth()-b.getMonth()); if(n.getDate()<b.getDate()) m--;
  if(m<0) return ""; return m<12 ? m+"개월" : Math.floor(m/12)+"살"+(m%12?" "+(m%12)+"개월":"");
}
function dueOf(it){ return it.last ? addDays(it.last, +it.every||30) : null; }
function ddayInfo(it){
  const due=dueOf(it); if(!due) return {txt:"날짜 없음", cls:"none", n:99999, due:null};
  const n=diffDays(due, today());
  return {txt: n===0?"오늘": n>0?"D-"+n : (-n)+"일 지남", cls: n<0?"over": n<=3?"soon":"", n, due};
}
function walksOn(ds){ return S.walks.filter(w=>w.date===ds); }
function weightLogs(){ return S.logs.filter(l=>l.type==="몸무게" && l.kg).sort((a,b)=>a.date<b.date?-1:1); }

/* ---------- 렌더 ---------- */
function render(){
  const p=prof();
  $("title").textContent = p.name ? p.name : "반려견 수첩";
  $("sub").textContent = [p.breed, ageText(p.birth)].filter(Boolean).join(" · ");
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===S.tab));
  $("fab").hidden = S.tab==="home";
  let h="";
  if(S.installTip) h += `<div class="banner" style="background:var(--accent-soft);color:var(--accent)">Safari 아래 공유 버튼 → <b>홈 화면에 추가</b> 후 그 아이콘으로 쓰세요. Safari 탭에서 입력한 내용은 홈 화면 앱과 따로 저장돼요.</div>`;
  if(!LS.ok()) h += `<div class="banner">이 브라우저에서는 저장할 수 없어요. 개인정보 보호 브라우징을 끄고 열어주세요.</div>`;
  if(S.slow) h += `<div class="banner">데이터를 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</div>`;
  if(S.loaded && S.db && !p.name && S.tab==="home") h += `<section class="card"><h2>처음 설정</h2><p style="margin:0 0 12px">강아지 정보를 먼저 넣어주세요.</p><button class="btn" data-act="profile">이름·생일 입력하기</button></section>`;
  h += S.tab==="home"? renderHome() : S.tab==="walk"? renderWalk() : S.tab==="care"? renderCare() : renderLog();
  $("main").innerHTML = h;
}

function walkButton(){
  const st = prof().walkStart;
  if(st){ const m=Math.max(0,Math.floor((Date.now()-st)/60000));
    return `<div style="display:flex;gap:8px"><button class="walk-btn on" data-act="walkEnd" style="flex:1">산책 끝내기 · ${m}분째</button><button class="mini" data-act="walkCancel" style="padding:0 16px;border-radius:14px">${S.cancelArmed?"정말 취소":"취소"}</button></div>`; }
  return `<button class="walk-btn" data-act="walkStart">산책 시작</button>`;
}

function renderHome(){
  const td=today(), tw=walksOn(td), mins=tw.reduce((a,w)=>a+(+w.min||0),0), km=tw.reduce((a,w)=>a+(+w.km||0),0);
  const goal=+prof().walkGoal||60;
  let h = `<section class="card"><h2>오늘 산책 <span class="num" style="font-weight:500">목표 ${goal}분</span></h2><div class="kpis">
    <div class="kpi"><div class="lab">횟수</div><div class="val num">${tw.length}<small>회</small></div></div>
    <div class="kpi"><div class="lab">시간</div><div class="val num">${mins}<small>분</small></div></div>
    <div class="kpi"><div class="lab">거리</div><div class="val num">${km?Math.round(km*10)/10:0}<small>km</small></div></div>
  </div><div style="height:7px;border-radius:4px;background:var(--line);margin:14px 0;overflow:hidden"><div style="height:100%;width:${Math.min(100,mins/goal*100)}%;background:var(--accent)"></div></div>${walkButton()}</section>`;
  const items = care().map(it=>({it, d:ddayInfo(it)})).sort((a,b)=>a.d.n-b.d.n);
  const urgent = items.filter(x=>x.d.n<=7);
  const undated = items.filter(x=>!x.it.last).length;
  h += `<section class="card"><h2>챙길 것 <span style="font-weight:500">7일 이내</span></h2>`;
  if(!urgent.length) h += `<div class="empty">일주일 안에 챙길 게 없어요.</div>`;
  urgent.slice(0,8).forEach(({it,d})=>{ h += careRow(it,d); });
  if(undated) h += `<p class="hint">마지막으로 한 날짜를 모르는 항목이 ${undated}개 있어요. <button class="mini" data-gocare="1" style="margin-left:4px">케어 탭에서 날짜 넣기</button></p>`;
  h += `</section>`;
  const lastLog = S.logs.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
  const w = weightLogs(); const lw=w[w.length-1];
  h += `<section class="card"><h2>최근 기록</h2>
    <div class="row"><span class="mid"><div class="t1">몸무게</div><div class="t2">${lw?esc(lw.date):"아직 기록 없음"}</div></span><span class="num" style="font-weight:600">${lw?lw.kg+"kg":"-"}</span></div>
    <div class="row"><span class="mid"><div class="t1">마지막 건강 기록</div><div class="t2">${lastLog?esc(lastLog.date+" · "+lastLog.type+(lastLog.title?" · "+lastLog.title:"")):"아직 기록 없음"}</div></span></div>
  </section>`;
  return h;
}

function careRow(it,d){
  return `<div class="row"><span class="dday ${d.cls}">${d.txt}</span><span class="mid"><div class="t1">${esc(it.name)}</div><div class="t2">${it.last?"마지막 "+esc(it.last)+" · ":""}${+it.every}일마다${d.due?" · 다음 "+esc(d.due):""}</div></span><button class="mini primary" data-done="${esc(it.id)}">완료</button></div>`;
}

function renderWalk(){
  const td=today();
  let h = `<section class="card">${walkButton()}</section>`;
  // 이번 주 7일
  const days=[]; for(let i=6;i>=0;i--) days.push(addDays(td,-i));
  const mins=days.map(d=>walksOn(d).reduce((a,w)=>a+(+w.min||0),0)), max=Math.max(+prof().walkGoal||60, ...mins);
  const total=mins.reduce((a,b)=>a+b,0);
  h += `<section class="card"><h2>최근 7일 <span class="num" style="font-weight:500">합계 ${total}분 · 하루 평균 ${Math.round(total/7)}분</span></h2><div class="week">${days.map((d,i)=>`<div class="${d===td?"today":""}"><div class="b"><i style="height:${mins[i]/max*100}%"></i></div><div class="v num">${mins[i]||""}</div><div class="d">${DOW[new Date(d+"T00:00:00").getDay()]}</div></div>`).join("")}</div></section>`;
  // 이번 달 연속 기록
  let streak=0; for(let i=0;i<400;i++){ const d=addDays(td,-i); if(walksOn(d).length) streak++; else if(i>0) break; else continue; }
  const month=td.slice(0,7), mWalks=S.walks.filter(w=>w.date.slice(0,7)===month);
  h += `<section class="card"><div class="kpis">
    <div class="kpi"><div class="lab">연속 산책</div><div class="val num">${streak}<small>일</small></div></div>
    <div class="kpi"><div class="lab">이번 달</div><div class="val num">${mWalks.length}<small>회</small></div></div>
    <div class="kpi"><div class="lab">이번 달 시간</div><div class="val num">${Math.round(mWalks.reduce((a,w)=>a+(+w.min||0),0)/6)/10}<small>시간</small></div></div>
  </div></section>`;
  const list=S.walks.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.start||0)-(a.start||0)).slice(0,40);
  h += `<section class="card"><h2>산책 기록</h2>`;
  if(!list.length) h += `<div class="empty">산책 시작 버튼이나 + 로 기록하세요.</div>`;
  list.forEach(w=>{ const t=w.start? new Date(w.start):null;
    h += `<div class="row"><span class="mid"><div class="t1">${esc(w.date.slice(5).replace("-","/"))} (${DOW[new Date(w.date+"T00:00:00").getDay()]})${t?" "+pad(t.getHours())+":"+pad(t.getMinutes()):""}</div><div class="t2">${w.km?w.km+"km":""}${w.note?(w.km?" · ":"")+esc(w.note):""}</div></span><span class="num" style="font-weight:600">${+w.min||0}분</span><button class="icon" data-editwalk="${esc(w.id)}" aria-label="수정">✎</button></div>`; });
  h += `</section>`;
  return h;
}

}

function renderLog(){
  const types=["전체","병원","몸무게","케어","메모"];
  let h = `<div class="seg">${types.map(k=>`<button data-lf="${k}" class="${S.logFilter===k?"on":""}">${k}</button>`).join("")}</div>`;
  const w=weightLogs();
  if(w.length && (S.logFilter==="전체"||S.logFilter==="몸무게")) h += `<section class="card"><h2>몸무게 변화 <span class="num" style="font-weight:500">${w[w.length-1].kg}kg</span></h2>${weightChart(w)}</section>`;
  const list=S.logs.filter(l=>S.logFilter==="전체"||l.type===S.logFilter).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0));

  list.forEach(l=>{
    const tc = l.type==="병원"?"h":l.type==="몸무게"?"w":l.type==="케어"?"c":"";
    h += `<div class="row"><span class="tag ${tc}">${esc(l.type)}</span><span class="mid" data-editlog="${esc(l.id)}" style="cursor:pointer"><div class="t1">${esc(l.type==="몸무게"? l.kg+"kg" : (l.title||l.type))}</div><div class="t2">${esc(l.date)}${l.place?" · "+esc(l.place):""}${l.note?" · "+esc(l.note):""}</div></span>${l.cost?`<span class="num" style="font-size:13px">${(+l.cost).toLocaleString("ko-KR")}원</span>`:""}</div>`;
  });
  h += `</section><section class="card"><h2>설정</h2><button class="mini" data-act="profile" style="width:100%;padding:11px">강아지 정보·산책 목표 수정</button>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="mini" data-act="backup" style="flex:1;padding:11px">백업 파일 저장</button><button class="mini" data-act="restore" style="flex:1;padding:11px">백업 불러오기</button></div>
    <input type="file" id="restoreFile" accept=".json,application/json" hidden>
    <p class="hint">기록은 이 폰 안에만 저장돼요. 홈 화면 아이콘을 지우거나 Safari 데이터를 지우면 사라지니 가끔 백업 파일을 저장해 두세요. 백업을 불러오면 지금 기록이 백업 내용으로 바뀌어요.</p></section>`;
  return h;
}

function weightChart(w){
  const pts=w.slice(-12), vals=pts.map(x=>+x.kg), lo=Math.floor(Math.min(...vals)*0.95*10)/10, hi=Math.ceil(Math.max(...vals)*1.05*10)/10 || 1;
  const W=340,H=150,L=34,B=22,T=10, span=Math.max(0.1,hi-lo), xs=i=> L + (pts.length===1? (W-L)/2 : i*(W-L-10)/(pts.length-1));
  const y=v=> T+(H-T-B)*(hi-v)/span;
  let g=""; for(let k=0;k<=3;k++){ const v=lo+span*k/3; g+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${Math.round(v*10)/10}</text>`; }
  const path=pts.map((p,i)=>(i?"L":"M")+xs(i)+" "+y(+p.kg)).join(" ");
  g += `<path d="${path} L${xs(pts.length-1)} ${H-B} L${xs(0)} ${H-B} Z" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  pts.forEach((p,i)=>{ g+=`<circle cx="${xs(i)}" cy="${y(+p.kg)}" r="${i===pts.length-1?4:2.5}" fill="var(--accent)"/>`; if(i===0||i===pts.length-1||pts.length<=6) g+=`<text x="${xs(i)}" y="${H-6}" text-anchor="middle">${+p.date.slice(5,7)}/${+p.date.slice(8)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="몸무게 변화">${g}</svg>`;
}

const num = v => Number(String(v||"").replace(/[^0-9.]/g,""))||0;
const intv = v => Number(String(v||"").replace(/[^0-9]/g,""))||0;

$("sheet").addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.close){ closeSheet(); return; }
  if(t.dataset.sdel){
    if(t.dataset.armed!=="1"){ t.dataset.armed="1"; t.textContent="한 번 더 누르면 삭제"; setTimeout(()=>{ if(t.isConnected){ t.dataset.armed=""; t.textContent="삭제"; } },2500); return; }
    const k=S.sheet.kind;
    try{
      if(k==="walk") await dbDel(S.walkCol.doc(S.sheet.id));
      if(k==="log") await dbDel(S.logCol.doc(S.sheet.id));
      if(k==="care"){ const items=care().filter(x=>x.id!==S.sheet.id); await saveCare(items); }
      closeSheet(); toast("삭제했어요");
    }catch(err){ $("fErr").textContent=errText(err); }
  }
});
$("sheet").addEventListener("submit", async e=>{
  e.preventDefault(); if(!S.db){ $("fErr").textContent="저장소에 연결되지 않았어요."; return; }
  const k=S.sheet.kind;
  try{
    if(k==="profile"){
      const name=$("pName").value.trim(); if(!name){ $("fErr").textContent="이름을 입력하세요."; return; }
      await dbSet(S.profDoc, {...prof(), name, breed:$("pBreed").value.trim(), birth:$("pBirth").value, walkGoal:intv($("pGoal").value)||60});
    }
    if(k==="walk"){
      const date=$("wDate").value, min=intv($("wMin").value); if(!date||!min){ $("fErr").textContent="날짜와 시간을 넣어주세요."; return; }
      const id=S.sheet.id||newId(); await dbSet(S.walkCol.doc(id), {date, min, km:num($("wKm").value), note:$("wNote").value.trim(), start:S.sheet.start||null});
    }
    if(k==="care"){
      const name=$("cName").value.trim(), every=intv($("cEvery").value); if(!name||!every){ $("fErr").textContent="이름과 주기를 넣어주세요."; return; }
      const kind=($("cKind").querySelector(".chip.on")||{}).dataset?.v||"관리";
      const items=care().map(x=>({...x})); const it={id:S.sheet.id||newId(), name, kind, every, last:$("cLast").value||""};
      const i=items.findIndex(x=>x.id===it.id); if(i>=0) items[i]=it; else items.push(it);
      await saveCare(items);
    }
    if(k==="log"){
      const t=S.sheet.type, date=$("lDate").value; if(!date){ $("fErr").textContent="날짜를 고르세요."; return; }
      const body={type:t, date, at:Date.now(), note:($("lNote")||{}).value?.trim()||""};
      if(t==="몸무게"){ body.kg=num($("lKg").value); if(!body.kg){ $("fErr").textContent="몸무게를 넣어주세요."; return; } }
      else { body.title=($("lTitle")||{}).value?.trim()||""; if($("lPlace")) body.place=$("lPlace").value.trim(); if($("lCost")) body.cost=intv($("lCost").value); }
      await dbSet(S.logCol.doc(S.sheet.id||newId()), body);
    }
    closeSheet(); toast("저장했어요");
  }catch(err){ $("fErr").textContent=errText(err); }
});
$("sheet").addEventListener("input", e=>{ if(e.target.id==="lCost"){ const d=e.target.value.replace(/[^0-9]/g,""); e.target.value=d?Number(d).toLocaleString("ko-KR"):""; } });

/* ---------- 메인 동작 ---------- */
$("main").addEventListener("click", async e=>{
  const t=e.target.closest("button,[data-editcare],[data-editlog]"); if(!t) return;
  const d=t.dataset;
  if(d.act==="profile") return sheetProfile();
  if(d.act==="backup") return backup();
  if(d.act==="restore") return $("restoreFile").click();
  if(d.act==="walkStart"){ if(!S.db) return toast("저장소에 연결되지 않았어요"); try{ await dbSet(S.profDoc,{...prof(), walkStart:Date.now()}); toast("산책 시작! 끝나면 다시 눌러주세요"); }catch(err){ toast(errText(err)); } return; }
  if(d.act==="walkCancel"){
    if(!S.cancelArmed){ S.cancelArmed=true; render(); setTimeout(()=>{ if(S.cancelArmed){ S.cancelArmed=false; render(); } },3000); return; }
    S.cancelArmed=false;
    try{ const p={...prof()}; delete p.walkStart; await dbSet(S.profDoc,p); toast("산책을 취소했어요 (기록 안 함)"); }catch(err){ toast(errText(err)); }
    return;
  }
  if(d.act==="walkEnd"){
    const st=prof().walkStart, min=Math.max(1,Math.round((Date.now()-st)/60000)), sd=new Date(st);
    try{ await dbSet(S.walkCol.doc(newId()), {date:fmtD(sd), min, km:0, note:"", start:st}); const p={...prof()}; delete p.walkStart; await dbSet(S.profDoc,p); toast(min+"분 산책을 기록했어요"); }catch(err){ toast(errText(err)); }
    return;
  }
  if(d.done){
    const items=care().map(x=>({...x})), it=items.find(x=>x.id===d.done); if(!it) return;
    it.last=today();
    try{ await saveCare(items); await dbSet(S.logCol.doc(newId()), {type:"케어", date:today(), title:it.name, at:Date.now(), note:""}); toast(it.name+" 완료! 다음은 "+addDays(it.last,+it.every)); }catch(err){ toast(errText(err)); }
    return;
  }
  if(d.cf){ S.careFilter=d.cf; render(); return; }
  if(d.gocare){ S.tab="care"; render(); $("main").scrollTop=0; return; }
  if(d.lf){ S.logFilter=d.lf; render(); return; }
  if(d.editwalk){ const w=S.walks.find(x=>x.id===d.editwalk); if(w) sheetWalk(w); return; }
  if(d.editcare!==undefined){ const it=care().find(x=>x.id===d.editcare); if(it) sheetCare(it); return; }
  if(d.editlog!==undefined){ const l=S.logs.find(x=>x.id===d.editlog); if(l) sheetLog(l); return; }
  if(d.cdelyes){ S.confirm=null; await saveCare(care().filter(x=>x.id!==d.cdelyes)); return; }
  if(d.no){ S.confirm=null; render(); return; }
});
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; S.confirm=null; render(); $("main").scrollTop=0; });

/* ---------- 이 폰에 저장 ---------- */
const LS = (()=>{
  const KEY="dogbook-v1"; let ok=true;
  const blank=()=>({dog:null, care:null, walks:{}, logs:{}});
  const load=()=>{ try{ const v=JSON.parse(localStorage.getItem(KEY)); return v&&v.walks?v:blank(); }catch(e){ ok=false; return blank(); } };
  let D=load(); const subs={dog:[],care:[],walks:[],logs:[]};
  const persist=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast("저장하지 못했어요. 저장 공간을 확인하세요."); throw e; } };
  const snapDoc=k=>({exists:!!D[k], data:()=>D[k], metadata:{fromCache:false}});
  const snapCol=k=>({docs:Object.keys(D[k]).map(id=>({id, data:()=>D[k][id]})), metadata:{fromCache:false}});
  const emit=k=>subs[k].forEach(f=>f(k==="dog"||k==="care"?snapDoc(k):snapCol(k)));
  const emitAll=()=>Object.keys(subs).forEach(emit);
  window.addEventListener("storage", e=>{ if(e.key===KEY){ D=load(); emitAll(); } });
  const docRef=k=>({ set:async v=>{ D[k]=v; persist(); emit(k); }, onSnapshot:n=>{ subs[k].push(n); setTimeout(()=>n(snapDoc(k)),0); return ()=>{}; } });
  const colRef=k=>({ doc:id=>({ set:async v=>{ D[k][id]=v; persist(); emit(k); }, delete:async()=>{ delete D[k][id]; persist(); emit(k); } }),
                     onSnapshot:n=>{ subs[k].push(n); setTimeout(()=>n(snapCol(k)),0); return ()=>{}; } });
  return { ok:()=>ok, dog:docRef("dog"), care:docRef("care"), walks:colRef("walks"), logs:colRef("logs"),
    dump:()=>JSON.parse(JSON.stringify(D)), replace:v=>{ D=Object.assign(blank(), v); persist(); emitAll(); } };
})();
async function saveFile(name, text, mime){
  const blob=new Blob([text],{type:mime});
  try{ const f=new File([blob],name,{type:mime}); if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function backup(){ saveFile("반려견수첩백업_"+today()+".json", JSON.stringify({app:"dogbook", version:1, savedAt:new Date().toISOString(), data:LS.dump()}), "application/json"); }
$("main").addEventListener("change", async e=>{
  if(e.target.id!=="restoreFile") return;
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const j=JSON.parse(await f.text()); if(!j||j.app!=="dogbook"||!j.data) throw 0; LS.replace(j.data); toast("백업을 불러왔어요"); }
  catch(_){ toast("이 앱에서 저장한 백업 파일인지 확인하세요"); }
});

/* ---------- 시작 ---------- */
S.db = {}; S.loaded = true;
S.profDoc=LS.dog; S.careDoc=LS.care; S.walkCol=LS.walks; S.logCol=LS.logs;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
S.installTip = /iPhone|iPad|iPod/.test(navigator.userAgent) && !(window.navigator.standalone===true || matchMedia("(display-mode: standalone)").matches);
S.profDoc.onSnapshot(s=>{ S.prof = s.exists? s.data() : null; render(); });
S.careDoc.onSnapshot(s=>{ S.care = s.exists? s.data() : null; render(); });
S.walkCol.onSnapshot(s=>{ S.walks=s.docs.map(x=>({id:x.id,...x.data()})); render(); });
S.logCol.onSnapshot(s=>{ S.logs=s.docs.map(x=>({id:x.id,...x.data()})); render(); });
render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
